{% extends 'base.html' %}

{% block header %}
    <h1>{% block title %}Log In{% endblock %}</h1>
{% endblock %}

{% block content %}
    <form method="post">
        <label for="password">Password</label>
        <input class="cs-input" type="password" name="password" id="password" required autofocus>
        <input class="cs-btn" type="submit" value="Log In">
    </form>
{% endblock %}
