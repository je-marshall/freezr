[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freezr"
version = "1.0.0"
description = "A local freezer inventory management system"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "gunicorn>=21.2.0"
]

[tool.setuptools]
packages = ["freezr"]
include-package-data = true
